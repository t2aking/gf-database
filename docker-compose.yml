services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: gf_database
      POSTGRES_USER: gf
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gf -d gf_database"]
      interval: 3s
      timeout: 3s
      retries: 10
    volumes:
      - gf_postgres_data:/var/lib/postgresql

volumes:
  gf_postgres_data:
